[project]
name = "backend"
version = "0.1.0"
description = "Prelegal API, and the server for the built frontend."
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.121.0",
    "litellm>=1.96.2",
    "pydantic-settings>=2.13.0",
    "pyjwt>=2.10.1",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.0",
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Defaults (pycodestyle, Pyflakes) plus import sorting, bugbear and pyupgrade.
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live tests call the real model, which costs money and needs the network.
# Run them deliberately with `uv run pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls the real language model"]
